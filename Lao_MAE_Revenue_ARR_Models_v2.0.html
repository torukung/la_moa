<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lao MAE · Revenue Sources &amp; ARR Models</title>
<meta name="description" content="Adeptio × Datacom: fee map, benchmarks, priorities, 5-year ARR models, user flows and wireframes for Lao MAE digital services (estimates for discussion).">
<style>
:root{
  --g900:#1E5C3F; --g700:#2E7D4F; --gold:#C9A227; --gold-ink:#7A5F0B;
  --ink:#1C2A24; --muted:#5B6B76; --border:#E4E6E1; --paper:#FAFAF7;
  --gt:#E9F2EC; --goldt:#FDF6E0; --card:#FFFFFF; --soft:#F3F4F0;
  --t3:#6E7F78; --t3t:#EEF1EE; --warn:#9A3B2E; --warnt:#FBEDEA;
  --wf:#E6E7E3; --wf2:#D3D5CF; --wf3:#B9BCB4;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(28,42,36,.05),0 4px 16px rgba(28,42,36,.05);
  --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans Lao","Noto Sans Thai",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--g700)}
a:hover{color:var(--g900)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g700);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}

/* Header */
.brand{background:var(--card);border-bottom:1px solid var(--border)}
.brand .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:16px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:9px;background:var(--g900);display:grid;place-items:center;flex:none}
.mark i{display:block;width:12px;height:12px;border:2.5px solid var(--gold);border-radius:3px;transform:rotate(45deg)}
.brand-text{min-width:0;flex:1 1 260px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g700)}
.brand h1{font-size:22px;font-weight:700;margin-top:2px}
.est-pill{font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--goldt);border:1px solid #EFDDA0;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tabs{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.96);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--border)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-top:6px;padding-bottom:6px}
.tab{flex:none;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .18s,color .18s}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--gt);color:var(--g900);font-weight:600}

main{padding:32px 0 48px}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.view.on{animation:none}*{transition:none!important}}
.sec-head{margin-bottom:22px;max-width:780px}
.sec-head h2{font-size:26px;font-weight:700}
.sec-head p{margin-top:8px;color:var(--muted)}
.block{margin-top:36px}
.block>h3{font-size:17px;font-weight:650;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:500}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--g900);line-height:1.1}
.kpi .val small{font-size:16px;font-weight:600;color:var(--muted)}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.accent{border-top:3px solid var(--gold)}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--gt);border:1px solid #CFE3D6;border-radius:var(--r);padding:14px 18px}
.banner b{color:var(--g900)}
.banner .txt{flex:1 1 320px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g900);background:var(--g900);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .18s,transform .1s}
.btn:hover{background:var(--g700);color:#fff}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--g900)}
.btn.ghost:hover{background:var(--card)}
.insight{display:flex;flex-direction:column;gap:8px}
.insight .n{width:26px;height:26px;border-radius:50%;background:var(--goldt);color:var(--gold-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.insight h4{font-size:15.5px;font-weight:650}
.insight p{font-size:14px;color:var(--muted)}
.qw{font-size:13.5px}
.qw b{display:block;color:var(--g900);margin-bottom:4px}

/* Tier tags */
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.t1{background:var(--g900);color:#fff}
.t2{background:var(--gt);color:var(--g900);border:1px solid #BFD9C8}
.t3{background:var(--t3t);color:#44524C;border:1px solid #DCE1DD}
.tS{background:var(--goldt);color:var(--gold-ink);border:1px solid #EBD592}
.free{background:#fff;color:var(--g700);border:1px dashed var(--g700)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--muted)}
.legend span.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.fchip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;transition:all .18s;min-height:34px}
.fchip:hover{border-color:var(--g700)}
.fchip[aria-pressed="true"]{background:var(--g900);border-color:var(--g900);color:#fff}

/* Fee map lanes */
.lanes{display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative}
.lane-h{display:flex;gap:10px;align-items:flex-start;min-width:0}
.lane-step{width:28px;height:28px;flex:none;border-radius:50%;background:var(--gt);color:var(--g900);font-weight:700;font-size:13px;display:grid;place-items:center}
.lane-h h4{font-size:15px;font-weight:650}
.lane-h .code{font-size:12px;color:var(--g700);font-weight:600}
.lane-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.lane:not(:last-child)::after{content:"";position:absolute;left:29px;bottom:-11px;width:2px;height:10px;background:#CFE3D6}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;min-width:0}
.fee{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--border);border-left:4px solid var(--t3);border-radius:10px;background:var(--card);padding:10px 12px;cursor:pointer;min-width:0;transition:border-color .18s,box-shadow .18s,opacity .18s,transform .1s}
.fee:hover{box-shadow:var(--shadow);border-color:#CBD3CD}
.fee:active{transform:scale(.99)}
.fee.k1{border-left-color:var(--g900)}
.fee.k2{border-left-color:var(--g700)}
.fee.k3{border-left-color:#A5B1AB}
.fee.kS{border-left-color:var(--gold)}
.fee.kF{border-left-color:var(--g700);border-style:dashed;border-left-style:solid;background:#FCFDFB}
.fee .top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.fee .nm{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.fee .py{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.fee .badges{display:flex;flex-wrap:wrap;gap:5px}
.fee.dim{opacity:.32}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(28,42,36,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(28,42,36,.12);transform:translateX(102%);transition:transform .25s cubic-bezier(.16,1,.3,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--border)}
.dr-h .t{flex:1;min-width:0}
.dr-h h3{font-size:18px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;flex:none;display:grid;place-items:center}
.x:hover{background:var(--soft)}
.dr-b{padding:18px 20px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bchip{font-size:12.5px;background:var(--soft);border:1px solid var(--border);border-radius:7px;padding:4px 8px;overflow-wrap:anywhere;max-width:100%}
.dr-b h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:8px}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
td.r,th.r,td.num{white-space:nowrap}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#F7F8F4;white-space:nowrap}
td.r,th.r{text-align:right}
tr.hl td{background:#F5FAF6}
tr.sel td{background:var(--goldt)}
.mx{min-width:1640px}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:170px;max-width:190px;box-shadow:1px 0 0 var(--border)}
.mx th:first-child{background:#F7F8F4}
.mx td{min-width:122px;max-width:150px;padding:8px 6px}
.mx .rowh{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.cell{display:flex;flex-direction:column;gap:2px;background:var(--gt);border-radius:7px;padding:6px 8px;overflow-wrap:break-word;hyphens:auto}
.cell b{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3}
.cell span{font-size:11.5px;color:var(--muted);line-height:1.3}
.cell.nf{background:transparent;border:1px dashed var(--border)}
.cell.nf b{color:#9AA5A0;font-weight:500}
.cell.fr{background:#F4F8F5;border:1px solid #CFE3D6}
.cell.fr b{color:var(--g700)}
.cell.la{background:var(--goldt)}
.cell .v{font-size:10.5px;font-weight:700;color:var(--gold-ink);letter-spacing:.03em}

/* Priorities */
.prio{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:34px minmax(0,2.2fr) minmax(150px,1.1fr) 196px 110px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:box-shadow .18s}
.prow:hover{box-shadow:var(--shadow)}
.prow .rk{font-weight:700;color:var(--muted);font-size:15px}
.prow .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.3}
.prow .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g700)}
.sc{display:flex;flex-direction:column;gap:5px}
.sc .v{font-size:13px;font-weight:700;color:var(--g900)}
.dots{display:flex;gap:5px}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1px solid #CFE3D6}
.dotlab{display:flex;gap:5px;font-size:9.5px;color:var(--muted);margin-top:3px}
.dotlab span{width:28px;text-align:center;white-space:nowrap}
.prow .rev{text-align:right;font-weight:700;font-size:15px;color:var(--g900)}
.prow .rev small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.weights{display:flex;flex-wrap:wrap;gap:8px}
.weights span{font-size:12.5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
.weights b{color:var(--g900)}

/* ARR */
.ctrls{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 12px;font-size:13.5px;cursor:pointer;min-height:36px;white-space:nowrap}
.seg button:hover{background:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--g900);color:#fff;font-weight:600}
.ctrl-l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.vdesc{margin-top:14px;font-size:14px;color:var(--muted);max-width:860px}
.chartbox{margin-top:16px}
#arrChart svg{display:block;width:100%;height:auto}
.split{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px}
.sp{background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0}
.sp .y{font-size:12px;color:var(--muted);font-weight:600}
.sp .sb{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:8px 0 6px;background:var(--border)}
.sp .sb i{display:block;height:100%}
.sp .vv{font-size:12.5px;display:flex;flex-direction:column;gap:1px}
.sp.tot{background:var(--gt)}
.rank ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rank li{padding-left:4px}
.rank .rec{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--goldt);border:1px solid #EBD592;font-size:14px}
details{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:0 18px}
details+details{margin-top:8px}
summary{cursor:pointer;padding:14px 0;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--g700);font-weight:700}
details[open] summary::after{content:"\2212"}
details .db{padding:0 0 16px;font-size:14px}
details dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0}
details dt{color:var(--muted)}
details dd{margin:0;overflow-wrap:anywhere}

/* Flows */
.flow{margin-top:18px}
.flow h4{font-size:16px;font-weight:650}
.flow .fdesc{font-size:13.5px;color:var(--muted);margin-top:4px}
.ftrack{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 0;padding:18px 0 6px}
.fnode{flex:none;width:152px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fbox{width:100%;min-height:96px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(28,42,36,.04)}
.fbox .st{font-size:11px;font-weight:700;color:var(--g700);letter-spacing:.04em}
.fbox .lb{font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.fbox .sb2{font-size:12px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.fbox.end{background:var(--gt);border-color:#BFD9C8}
.fbox.start{border-color:var(--g700)}
.dia{width:132px;height:104px;position:relative;flex:none}
.dia::before,.dia::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dia::before{background:var(--gold)}
.dia::after{inset:2px;background:var(--goldt)}
.dia span{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;padding:0 28px;font-size:12.5px;font-weight:650;line-height:1.25;color:var(--ink)}
.branches{display:flex;flex-direction:column;gap:4px;width:100%}
.br{font-size:11.5px;border-radius:7px;padding:4px 7px;line-height:1.3;overflow-wrap:anywhere}
.br.ok{background:var(--gt);color:var(--g900)}
.br.no{background:var(--warnt);color:var(--warn)}
.br.info{background:var(--goldt);color:var(--gold-ink)}
.payer{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--goldt);color:var(--gold-ink);border:1px solid #EBD592;align-self:flex-start;white-space:nowrap}
.payer.freeb{background:#fff;color:var(--g700);border:1px dashed var(--g700)}
.farrow{flex:none;width:30px;height:96px;display:grid;place-items:center;color:#9FB3A8}
.farrow svg{width:22px;height:14px}

/* Wireframes */
.wfgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.wframe{background:#FBFBFA;border:1.5px solid var(--wf3);border-radius:12px;overflow:hidden;min-width:0}
.wbar{display:flex;gap:6px;align-items:center;background:var(--wf);padding:8px 10px;border-bottom:1px solid var(--wf2)}
.wbar i{width:9px;height:9px;border-radius:50%;background:var(--wf3)}
.wbar .url{flex:1;height:14px;border-radius:7px;background:#fff;margin-left:8px;font-size:10px;color:#8C918A;padding:0 8px;line-height:14px;overflow:hidden;white-space:nowrap}
.wbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.wrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wb{background:var(--wf);border:1px solid var(--wf2);border-radius:8px;padding:10px;min-width:0;position:relative}
.wt{font-size:11.5px;font-weight:700;color:#6B7069;text-transform:uppercase;letter-spacing:.04em}
.wl{height:8px;border-radius:4px;background:var(--wf2);margin-top:7px}
.wl.s{width:40%}.wl.m{width:65%}.wl.l{width:88%}
.wtx{font-size:12px;color:#5E635D;overflow-wrap:anywhere}
.wbtn{display:inline-block;background:#8E938C;color:#fff;font-size:11.5px;font-weight:600;border-radius:6px;padding:5px 10px;white-space:nowrap}
.wbtn.o{background:transparent;color:#6B7069;border:1px solid var(--wf3)}
.wchip{display:inline-block;font-size:11px;border:1px solid var(--wf3);border-radius:999px;padding:2px 8px;color:#5E635D;background:#fff;white-space:nowrap}
.wchip.on{background:#8E938C;color:#fff;border-color:#8E938C}
.cm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;flex:none;vertical-align:middle;margin-right:6px}
.wg{display:grid;gap:10px}
.wg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.wg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.wg2{grid-template-columns:repeat(2,minmax(0,1fr))}
.wqr{width:84px;height:84px;background:repeating-linear-gradient(45deg,#C9CCC5 0 6px,#E6E7E3 6px 12px);border:1px solid var(--wf3);border-radius:6px;flex:none}
.wbars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.wbars i{flex:1;background:var(--wf3);border-radius:3px 3px 0 0}
.wline{height:80px;margin-top:8px}
.notes{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.notes li{list-style:none;display:flex;gap:8px;align-items:flex-start}
.notes ol{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.step6 div{font-size:11px;text-align:center;border-top:4px solid var(--wf2);padding-top:6px;color:#6B7069;overflow-wrap:anywhere;line-height:1.25}
.step6 div.on{border-top-color:#6B7069;color:var(--ink);font-weight:700}
.step6 div.dn{border-top-color:var(--wf3)}
.phone{width:min(300px,100%);margin:0 auto;border:1.5px solid var(--wf3);border-radius:26px;background:#FBFBFA;padding:14px 12px 18px;display:flex;flex-direction:column;gap:10px}
.phone .notch{width:80px;height:6px;border-radius:3px;background:var(--wf2);margin:0 auto 4px}
.wfpair{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.lineitem{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#5E635D;padding:5px 0;border-bottom:1px dashed var(--wf2)}
.lineitem:last-child{border-bottom:0;font-weight:700;color:var(--ink)}
.wfcap{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.wfx{display:flex;flex-direction:column;gap:22px}
.wfx h4{font-size:16px;font-weight:650;margin-bottom:10px}

/* Wireflow */
.wflow{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);-webkit-overflow-scrolling:touch}
.wflow svg{display:block}

/* Risks */
.risk{display:flex;flex-direction:column;gap:8px}
.risk h4{font-size:15px;font-weight:650}
.risk .rl{font-size:13.5px;color:var(--muted)}
.risk .ml{font-size:13.5px;background:var(--gt);border-radius:8px;padding:8px 10px}
.risk .ml b{color:var(--g900)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--g900);flex:none}
.srcg h4{font-size:14.5px;font-weight:650;margin-bottom:8px}
.srcg ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.srcg li{overflow-wrap:anywhere}

footer{border-top:1px solid var(--border);background:var(--card)}
footer .wrap{padding-top:18px;padding-bottom:22px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:13px;color:var(--muted)}

/* Responsive */
@media (max-width:1100px){
  .g2w{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:30px minmax(0,1fr) 196px 100px}
  .prow .sc{grid-column:2/3}
  .prow .dw{grid-column:3/4;grid-row:1/3}
  .prow .rev{grid-column:4/5;grid-row:1/3}
  .split{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wfgrid{grid-template-columns:minmax(0,1fr)}
  .notes ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
}
@media (max-width:860px){
  .wrap{padding:0 20px}
  .g3{grid-template-columns:minmax(0,1fr)}
  .g2{grid-template-columns:minmax(0,1fr)}
  .lane{grid-template-columns:minmax(0,1fr);gap:10px}
  .lane:not(:last-child)::after{display:none}
  .wfpair{grid-template-columns:minmax(0,1fr)}
  .wg4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:28px minmax(0,1fr) 90px}
  .prow .sc{grid-column:2/4}
  .prow .dw{grid-column:2/4;grid-row:auto}
  .prow .rev{grid-column:3/4;grid-row:1/2}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  body{font-size:14.5px}
  .brand h1{font-size:19px}
  .sec-head h2{font-size:22px}
  .g4,.g5{grid-template-columns:minmax(0,1fr)}
  .kpi .val{font-size:26px}
  .split{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:8px}
  details dl{grid-template-columns:minmax(0,1fr);gap:2px}
  details dd{margin-bottom:8px}
  .wg3{grid-template-columns:minmax(0,1fr)}
  .wg2{grid-template-columns:minmax(0,1fr)}
  .notes ol{grid-template-columns:minmax(0,1fr)}
  .step6{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .ftrack{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;padding:14px 0 6px}
  .fnode{width:100%;align-items:stretch}
  .fnode .dia{align-self:center}
  .farrow{width:100%;height:26px}
  .farrow svg{transform:rotate(90deg)}
  .prow{grid-template-columns:24px minmax(0,1fr) 80px;padding:12px}
  .dot,.dotlab span{width:28px}
  .dot{height:27px}
  .dots,.dotlab{gap:3px}
}
@media print{
  .tabs,.scrim,.drawer,.filters,.ctrls .seg{display:none!important}
  section.view{display:block!important;break-before:page}
  section.view:first-of-type{break-before:auto}
  body{background:#fff;font-size:12px}
  .card,.lane,.prow,.fbox{break-inside:avoid}
  .tw,.wflow,.ftrack{overflow:visible}
  .mx{min-width:0}
}

/* ---------- v1.1 · Language switch + Thai typography ---------- */
:root{--font-th:"Noto Sans Thai","Sarabun","IBM Plex Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif}
.hdr-r{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;max-width:100%}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--card);padding:2px;gap:2px;flex:none}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px;min-width:46px;line-height:1.2;transition:background .18s,color .18s}
.lang button:hover{color:var(--ink);background:var(--soft)}
.lang button[aria-pressed="true"]{background:var(--g900);color:#fff}
.lang button[lang="th"]{font-family:var(--font-th)}
.cn{display:block;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink)}
.cc{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.chlog{margin-top:22px;font-size:12.5px;color:var(--muted)}

/* Thai: system font stack only (works offline), roomier leading, no tracking/uppercase */
html:lang(th) body{font-family:var(--font-th);line-height:1.65;word-break:normal;overflow-wrap:break-word}
:lang(th) h1,:lang(th) h2,:lang(th) h3,:lang(th) h4{letter-spacing:0;line-height:1.4;text-wrap:balance}
:lang(th) .eyebrow,:lang(th) th,:lang(th) .ctrl-l,:lang(th) .dr-b h4,:lang(th) .wt,:lang(th) .cell .v,:lang(th) .fbox .st{text-transform:none;letter-spacing:0}
:lang(th) .kpi .val{letter-spacing:-.01em}
:lang(th) td,:lang(th) .cell,:lang(th) .fee .nm,:lang(th) .fee .py,:lang(th) .bchip,:lang(th) .kv dd,:lang(th) details dd,:lang(th) .fbox .lb,:lang(th) .fbox .sb2,:lang(th) .br,:lang(th) .step6 div,:lang(th) .wtx{word-break:normal;overflow-wrap:anywhere}
:lang(th) .tag,:lang(th) .payer,:lang(th) .wchip{white-space:normal;text-align:left}
:lang(th) .cell b,:lang(th) .cell span,:lang(th) .fee .nm,:lang(th) .prow .nm,:lang(th) .fbox .lb,:lang(th) .fbox .sb2,:lang(th) .br,:lang(th) .dia span{line-height:1.45}
:lang(th) .dotlab{font-size:9.5px}
:lang(th) .mx th:first-child,:lang(th) .mx td:first-child{min-width:196px;max-width:216px}
:lang(th) .insight p,:lang(th) .sec-head p,:lang(th) .vdesc{line-height:1.7}
:lang(th) .dia span{padding:0 24px;font-size:12px}
@media (max-width:640px){
  .hdr-r{width:100%;justify-content:space-between}
}

/* ---------- v2.0 · Scope switch + environment scope ---------- */
:root{--teal:#2E6F6A;--tealt:#E8F1EF;--tealb:#C5DCD7}
[hidden]{display:none!important}
.stick{position:sticky;top:0;z-index:20}
.stick .tabs{position:static}
.scopebar{background:rgba(255,255,255,.97);border-bottom:1px solid var(--border)}
.scopebar .wrap{display:flex;align-items:center;gap:8px 14px;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.sb-l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.seg.sc-seg{padding:2px;border-radius:9px;flex-wrap:nowrap}
.sc-seg button{min-height:34px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.sc-seg button:hover{color:var(--ink)}
.sc-seg button[aria-pressed="true"]{color:#fff}
.sc-seg button[data-scope="env"][aria-pressed="true"]{background:var(--teal)}
.sb-note{font-size:12.5px;color:var(--muted);min-width:0;flex:1 1 200px}
:lang(th) .sb-l{text-transform:none;letter-spacing:0}
@media (max-width:640px){
  .sb-note,.sb-l{display:none}
  .seg.sc-seg{display:flex;width:100%}
  .sc-seg button{flex:1 1 0;padding:5px 6px;min-width:0}
}
.grp-h{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--g900);margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.grp-h::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--g700);flex:none}
.grp-h.env{color:var(--teal)}
.grp-h.env::before{background:var(--teal)}
.grp-h.st{color:var(--gold-ink)}
.grp-h.st::before{background:var(--gold)}
#insights>.grp-h:first-child,#lanes>.grp-h:first-child,#riskCards>.grp-h:first-child,#wlAgri>.grp-h:first-child,#wlEnv>.grp-h:first-child{margin-top:0}
:lang(th) .grp-h{text-transform:none;letter-spacing:0;font-size:14px}
.lane.env .lane-step{background:var(--tealt);color:var(--teal)}
.lane.env .lane-h .code{color:var(--teal)}
.lane.env:not(:last-child)::after{background:var(--tealb)}
.codes{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.codes .cl{font-weight:600;margin-right:2px}
.codes span:not(.cl){background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.codes b{color:var(--teal);font-weight:700;margin-right:5px}
/* strategic upside: deliberately muted, never styled like committed revenue */
.strat{background:#FBFBF9;border:1.5px dashed #C9CCC5;border-radius:var(--r);padding:18px 20px;min-width:0}
.strat-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.strat-h h3{font-size:16px;font-weight:650;color:#4A5751;min-width:0;flex:1 1 280px}
.strat .pill{font-size:11.5px;font-weight:600;color:#6B7069;border:1px dashed #A9ADA6;border-radius:999px;padding:3px 10px;white-space:nowrap;background:#fff}
.strat .sp-d{font-size:13px;color:var(--muted);margin-top:6px;max-width:820px}
.strat .tw{margin-top:12px;background:#fff;border-style:dashed}
.st-t{min-width:880px;font-size:13px}
.st-t th{background:#F4F5F1}
.st-t td{color:#5E635D}
.st-t td.r{color:#6B7069}
.st-t th.fl,.st-t td.fl{min-width:240px}
.st-t td.it{min-width:200px}
.st-t tr.tot td{font-weight:700;color:#4A5751;background:#F4F5F1}
.stl{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:#4A5751;font-size:13px;line-height:1.4;text-decoration:underline;text-decoration-color:#C9CCC5;text-underline-offset:3px}
.stl:hover{color:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flag{font-size:11px;border-radius:999px;padding:2px 8px;border:1px dashed #D9A79E;color:var(--warn);background:#FFF8F6;white-space:nowrap;line-height:1.5}
:lang(th) .flag{white-space:normal}
.prow.strat-row{background:#FBFBF9;border-style:dashed}
.prow.strat-row .rev{color:#6B7069}
#cumTable td:first-child,#cumTable th:first-child{min-width:150px}
:lang(th) #cumTable td:first-child{overflow-wrap:normal;min-width:170px}
.feenote{font-size:12px;color:var(--muted);margin-top:6px;max-width:320px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button:disabled:hover{background:transparent}
.mx tr.grp td{background:#F7F8F4;font-size:12px;font-weight:700;color:var(--g900);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px}
.mx tr.grp.env td{color:var(--teal)}
:lang(th) .mx tr.grp td{text-transform:none;letter-spacing:0;font-size:13px}
.wcal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:8px}
.wcal span{font-size:10px;text-align:center;border:1px solid var(--wf2);border-radius:4px;padding:4px 0;color:#6B7069;background:#fff}
.wcal span.due{background:#8E938C;color:#fff;border-color:#8E938C}
.wcal span.dn{background:var(--wf2)}
.wtr{display:flex;justify-content:space-between;gap:6px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--wf2);font-size:12px;color:#5E635D;flex-wrap:wrap}
.wtr:last-child{border-bottom:0}
.wl-sub{font-size:13.5px;font-weight:650;color:var(--ink);margin:0 0 10px}
.wl-steps{margin:14px 0 26px;padding-left:20px;columns:2 280px;column-gap:28px}
.wl-steps li{margin-bottom:6px;break-inside:avoid}
.lineitem .nw{white-space:nowrap;flex:none}
@media (max-width:640px){.wcal{grid-template-columns:repeat(6,minmax(0,1fr))}.strat{padding:16px}}
</style>
</head>
<body>

    </div>

<main>

<!-- 1 OVERVIEW -->

/* ---------- Static text (data-i18n) ---------- */
function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(n=>{n.innerHTML=t(n.dataset.i18n);});
  document.querySelectorAll("[data-i18n-aria]").forEach(n=>{n.setAttribute("aria-label",t(n.dataset.i18nAria));});
  document.querySelectorAll("[data-i18n-s]").forEach(n=>{n.innerHTML=ts(n.dataset.i18nS);});
  document.title=t("doc.title");
}

/* ---------- SVG text helpers (measure + wrap; Thai-aware) ---------- */
const cv=document.createElement("canvas").getContext("2d");
function fam(){return getComputedStyle(document.body).fontFamily;}
function tw(s,size,weight){cv.font=`${weight||400} ${size}px ${fam()}`;return cv.measureText(s).width;}
function segs(s){
  if(typeof Intl!=="undefined"&&Intl.Segmenter){try{return Array.from(new Intl.Segmenter(LANG,{granularity:"word"}).segment(s),x=>x.segment);}catch(e){}}
  return s.split(/(\s+)/);
}
function wrapLines(s,max,size,weight){
  const out=[];let cur="";
  segs(s).forEach(p=>{const nx=cur+p;if(cur&&tw(nx.trim(),size,weight)>max){out.push(cur.trim());cur=p.trimStart();}else cur=nx;});
  if(cur.trim())out.push(cur.trim());return out;
}

/* ---------- Tabs / routing ---------- */
const TABS=["overview","feemap","benchmarks","priorities","arr","flows","wireframes","wireflow","risks"];
const tb=$("#tabbar");
function curTab(){let k=(location.hash||"#overview").slice(1).split("&")[0];return TABS.includes(k)?k:"overview";}
function renderTabs(){tb.innerHTML=TABS.map(k=>`<a class="tab" href="#${k}" data-k="${k}">${esc(t("tab."+k))}</a>`).join("");markTab(false);}
function markTab(scroll){const k=curTab();tb.querySelectorAll(".tab").forEach(a=>{if(a.dataset.k===k){a.setAttribute("aria-current","page");const p=tb,l=a.offsetLeft,r=l+a.offsetWidth;if(scroll!==false||l<p.scrollLeft||r>p.scrollLeft+p.clientWidth){if(l<p.scrollLeft||r>p.scrollLeft+p.clientWidth)p.scrollLeft=l-16;}}else a.removeAttribute("aria-current");});}
function route(){
  const k=curTab();
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+k));
  markTab(true);
  if(k==="arr")renderARR();
  window.scrollTo({top:0});
}
window.addEventListener("hashchange",()=>{const l=urlLang();if(l&&l!==LANG)setLang(l,false);const sc=urlScope();if(sc&&sc!==SCOPE)setScope(sc,false);route();});

const dr=$("#drawer"),scr=$("#scrim");let lastFocus=null,drId=null;
function revBars(s){
  const w=380,h=150,ml=8,mb=22,mt=18;const vals=s.usd.map(y=>y.stat+y.fee);const mx=Math.max(...vals,1);
  const bw=(w-ml*2)/5;let g="";
  s.usd.forEach((y,i)=>{const x=ml+i*bw+bw*.2,bwi=bw*.6;const hs=(y.stat/mx)*(h-mt-mb),hf=(y.fee/mx)*(h-mt-mb);const base=h-mb;
    g+=`<rect x="${x}" y="${base-hs}" width="${bwi}" height="${hs}" fill="#BFD9C8"><title>${YRS[i]} ${t("dr.tStat")} ${usd(y.stat)}</title></rect>`;
    g+=`<rect x="${x}" y="${base-hs-hf}" width="${bwi}" height="${hf}" fill="#1E5C3F"><title>${YRS[i]} ${t("dr.tNew")} ${usd(y.fee)}</title></rect>`;
    g+=`<text x="${x+bwi/2}" y="${base-hs-hf-5}" text-anchor="middle" font-size="10.5" fill="#1C2A24" font-weight="600">${usd(y.stat+y.fee,1).replace("US$","")}</text>`;
    g+=`<text x="${x+bwi/2}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="#5B6B76">Y${i+1}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${t("dr.revAria")}">${g}<line x1="${ml}" x2="${w-ml}" y1="${h-mb}" y2="${h-mb}" stroke="#E4E6E1"/></svg>`;
}
function drawerContent(id){
  let meta,title,body;
  if(FREECHIP[id]){const f=FREECHIP[id];meta=`<span class="tag free">${tx(FREEB[id])}</span>`;title=tx(f.name);
    body=`<dl class="kv"><dt>${t("dr.payer")}</dt><dd>${t("dr.none")} (${esc(tx(f.payer))})</dd><dt>${t("dr.statToday")}</dt><dd>${/^FE/.test(id)?t("dr.noneToday"):t("dr.freeStat")}</dd><dt>${t("dr.proposed")}</dt><dd>${t("dr.free")}</dd></dl><p class="small">${tx(f.note)}</p>`;}
  else{const s=S[id];const env=s.scope==="env";
    meta=`<span class="small muted" style="font-weight:600">${id} · ${s.code} · ${s.grp==="b2b"?t("dr.grpB2b"):s.grp==="mae"?t("dr.grpMae"):t("dr.grpGov")}</span> ${tierTag(id)}`;
    title=sT(id,"name");
    const st=s.stat?`${lak(s.stat)} LAK (≈ US$${s.stat_usd})`:t("dr.noneToday");
    const sp=env&&VOLTXT[id]&&id!=="V10";
    const pr=id==="X01"?t("dr.x01"):id==="B05"?t("dr.b05"):sp?(s.grp==="mae"?t("dr.seeBasisX"):t("dr.seeBasis")):`${lak(s.efee)} LAK (≈ ${env&&s.efee_usd>=1000?usd(s.efee_usd):"US$"+s.efee_usd})`;
    const vol=env&&VOLTXT[id]?esc(tx(VOLTXT[id])):`${lak(s.vol)}${id==="X01"?t("dr.kg"):""}`;
    const y5=s.usd[4];
    const ver=(id==="R01"||id==="V02")?` <span class="tag tS">${t("dr.verify")}</span>`:"";
    const note=id==="B05"?t("dr.b05note"):s.grp==="mae"?t("dr.x01note"):ENVNOTE[id]?tx(ENVNOTE[id]):"";
    body=`<dl class="kv"><dt>${t("dr.payer")}</dt><dd>${esc(sT(id,"payer"))}</dd><dt>${t("dr.statToday")}</dt><dd class="num">${st}${ver}</dd><dt>${t("dr.proposedFee")}</dt><dd class="num">${pr}</dd><dt>${t("dr.basis")}</dt><dd>${esc(sT(id,"basis"))}</dd><dt>${t("dr.vol")}</dt><dd class="num">${vol}</dd><dt>${t("dr.y5")}</dt><dd class="num"><b>${usd(y5.stat+y5.fee)}</b> ${tf("dr.y5split",{s:usd(y5.stat),n:usd(y5.fee)})}</dd></dl>
    <div><h4>${t("dr.bench")}</h4><div class="bench">${clean(sT(id,"bench")).split(/\s·\s/).map(b=>`<span class="bchip">${esc(b)}</span>`).join("")}</div></div>
    <div><h4>${t("dr.rev")}</h4><div class="legend xs" style="margin-bottom:4px"><span><span class="sw" style="background:#BFD9C8"></span>${t("dr.lgStat")}</span><span><span class="sw" style="background:#1E5C3F"></span>${t("dr.lgNew")}</span></div>${revBars(s)}${note?`<p class="xs muted">${note}</p>`:""}</div>
    <div><h4>${tf("dr.scores",{v:s.score.toFixed(2)})}</h4>${dotsHTML(s)}</div>`;}
  $("#drMeta").innerHTML=meta;$("#drTitle").textContent=clean(title);$("#drBody").innerHTML=body;
}
function openDrawer(id){
  lastFocus=document.activeElement;drId=id;drawerContent(id);
  dr.classList.add("on");scr.classList.add("on");dr.setAttribute("aria-hidden","false");$("#drClose").focus();
}
function closeDrawer(){dr.classList.remove("on");scr.classList.remove("on");dr.setAttribute("aria-hidden","true");drId=null;if(lastFocus)lastFocus.focus();}
$("#drClose").onclick=closeDrawer;scr.onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dr.classList.contains("on"))closeDrawer();});

function renderBench(){
  const rA=SCOPE!=="env"?BM:[],rE=SCOPE!=="agri"?BM_ENV:[],rows=rA.concat(rE);
  const cols=CN_ALL.filter(c=>rows.some(r=>r[1][c]&&r[1][c][0]!=="n/f"));
  const head=c=>LANG==="th"?`<th title="${tx(CNAME[c])}"><span class="cn">${tx(CNAME[c])}</span><span class="cc">${c}</span></th>`:`<th title="${CNAME[c].en}">${c}</th>`;
  const row=([r,cells])=>`<tr><td class="rowh">${esc(tx(r))}</td>`+cols.map(c=>{const v=cells[c]||N;if(v[0]==="n/f")return `<td><div class="cell nf"><b>${t("bm.nf")}</b></div></td>`;const cls=v[2]==="fr"?"fr":(c==="LA"?"la":"");const a=tx(v[0]),b=tx(v[1]);return `<td><div class="cell ${cls}"><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:""}${v[2]==="v"?`<span class="v">${t("bm.verify")}</span>`:""}</div></td>`;}).join("")+`</tr>`;
  const grp=k=>`<tr class="grp${k==="env"?" env":""}"><td>${t(k==="env"?"bm.grpE":"bm.grpA")}</td><td colspan="${cols.length}"></td></tr>`;
  let bt=`<thead><tr><th>${t("bm.touch")}</th>${cols.map(head).join("")}</tr></thead><tbody>`;
  bt+=SCOPE==="all"?grp("agri")+rA.map(row).join("")+grp("env")+rE.map(row).join(""):rows.map(row).join("");
  const tb=$("#bmTable");tb.innerHTML=bt+"</tbody>";tb.style.minWidth=cols.length>12?(200+cols.length*124)+"px":"";
  $("#patterns").innerHTML=(SCOPE==="agri"?PAT:SCOPE==="env"?PAT_ENV:PAT.concat(PAT_ENV)).map(p=>`<div class="card insight"><h4>${tx(p[0])}</h4><p>${tx(p[1])}</p></div>`).join("");
}

function renderPrio(){

function drawWL(W0,cols,aria,sfx){
  const LX=136,CW=172,TW=116,TH=76,LH=124,T0=16;
  const nodes=W0.nodes,NL=W0.lanes.length;
  const W=LX+(cols-1)*CW+TW+14,Hh=T0+LH*NL+10;
  const nx=n=>LX+nodes[n][1]*CW, ny=n=>T0+nodes[n][0]*LH+(LH-TH)/2;
  const mk="ah"+sfx;
  let g=`<defs><marker id="${mk}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E7D4F"/></marker></defs>`;
  W0.lanes.forEach((lo,i)=>{const l=tx(lo);const y=T0+i*LH;let fz=12.5;while(fz>10&&tw(l,fz,650)>106)fz-=.5;if(tw(l,fz,650)>110)console.warn("WL-lane "+l);
    g+=`<rect x="0" y="${y}" width="${W}" height="${LH}" fill="${i%2?"#FAFAF7":"#FFFFFF"}"/><line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#E4E6E1"/><rect x="12" y="${y+LH/2-15}" width="118" height="30" rx="15" fill="#E9F2EC"/><text x="71" y="${y+LH/2+4.5}" text-anchor="middle" font-size="${fz}" font-weight="650" fill="#1E5C3F">${esc(l)}</text>`;});
  g+=`<line x1="0" x2="${W}" y1="${T0+NL*LH}" y2="${T0+NL*LH}" stroke="#E4E6E1"/>`;
  const pill=(x,y,s)=>{const w=Math.ceil(tw(s,10.5,600))+16;return `<rect x="${x-w/2}" y="${y-9}" width="${w}" height="18" rx="9" fill="#fff" stroke="#BFD9C8"/><text x="${x}" y="${y+3.8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1E5C3F">${esc(s)}</text>`;};
  let lab="";
  W0.edges.forEach(([a,b,lo])=>{const s=tx(lo);const sx=nx(a)+TW,sy=ny(a)+TH/2,tX=nx(b),ty=ny(b)+TH/2;
    if(nx(a)===nx(b)){const cx=nx(a)+TW/2,down=ny(b)>ny(a),y1=down?ny(a)+TH:ny(a),y2=down?ny(b):ny(b)+TH;g+=`<path d="M${cx} ${y1}V${down?y2-3:y2+3}" fill="none" stroke="#2E7D4F" stroke-width="1.6" marker-end="url(#${mk})"/>`;lab+=pill(cx,(y1+y2)/2,s);}
    else if(sy===ty){g+=`<path d="M${sx} ${sy}H${tX-3}" fill="none" stroke="#2E7D4F" stroke-width="1.6" marker-end="url(#${mk})"/>`;lab+=pill((sx+tX)/2,sy-14,s);}
    else if(ty<sy){const cx=nx(a)+TW/2;g+=`<path d="M${cx} ${ny(a)}V${ty}H${tX-3}" fill="none" stroke="#2E7D4F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#${mk})"/>`;lab+=pill(cx,(ny(a)+ty)/2,s);}
    else{const mxx=tX-30;g+=`<path d="M${sx} ${sy}H${mxx}V${ty}H${tX-3}" fill="none" stroke="#2E7D4F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#${mk})"/>`;lab+=pill(mxx,(sy+ty)/2,s);}});
  Object.keys(nodes).forEach(k=>{const x=nx(k),y=ny(k),s=tx(nodes[k][2]);const isW=/^W\d/.test(s);
    let fz=10.5,lines=wrapLines(s,TW-16,fz,700);
    while(lines.length>2&&fz>9){fz-=.5;lines=wrapLines(s,TW-16,fz,700);}
    if(lines.length>2)console.warn("WL-trunc "+s);
    const two=lines.length>1;const ty0=two?y+25:y+28;const lh=fz+2;
    const txt=`<text x="${x+8}" y="${ty0}" font-size="${fz}" font-weight="700" fill="#1C2A24">${lines.slice(0,2).map((ln,i)=>`<tspan x="${x+8}" dy="${i?lh:0}">${esc(ln)}</tspan>`).join("")}</text>`;
    const b1=two?y+44:y+38,b2=two?y+54:y+50,b3=two?y+63:y+60;
    g+=`<g><rect x="${x}" y="${y}" width="${TW}" height="${TH}" rx="8" fill="#FBFBFA" stroke="${isW?"#9A9E97":"#C9CCC5"}" stroke-width="1.3" ${isW?"":'stroke-dasharray="4 3"'}/><rect x="${x}" y="${y}" width="${TW}" height="12" rx="8" fill="#E6E7E3"/><rect x="${x}" y="${y+6}" width="${TW}" height="6" fill="#E6E7E3"/>
    ${txt}
    <rect x="${x+8}" y="${b1}" width="${TW-30}" height="6" rx="3" fill="#D3D5CF"/><rect x="${x+8}" y="${b2}" width="${TW-50}" height="6" rx="3" fill="#D3D5CF"/><rect x="${x+8}" y="${b3}" width="34" height="9" rx="3" fill="#B9BCB4"/></g>`;});
  return `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(t(aria))}">${g}${lab}</svg>`;
}

  document.querySelectorAll(".wl-grp").forEach(h=>{h.hidden=SCOPE!=="all";});

function renderRisks(){
  const card=r=>`<div class="card risk"><h4>${tx(r[0])}</h4><p class="rl">${tx(r[1])}</p><p class="ml"><b>${t("rk.mit")}</b> ${tx(r[2])}</p></div>`;
  const grid=l=>`<div class="grid g3">${l.map(card).join("")}</div>`;
  $("#riskCards").innerHTML=SCOPE==="agri"?grid(RISKS):SCOPE==="env"?grid(RISKS_ENV):grpH("agri")+grid(RISKS)+grpH("env")+grid(RISKS_ENV);
  const dA=DISC.map((d,i)=>[String(i),d]),dE=DISC_ENV.map((d,i)=>["e"+i,d]);
  $("#disc").innerHTML=(SCOPE==="agri"?dA:SCOPE==="env"?dE:dA.concat(dE)).map(([k,d])=>`<label class="check"><input type="checkbox" data-i="${k}" ${saved[k]?"checked":""}><span>${tx(d)}</span></label>`).join("");
  $("#personas").innerHTML=(SCOPE==="agri"?PERSONAS:SCOPE==="env"?PERSONAS_ENV:PERSONAS.concat(PERSONAS_ENV)).map(p=>`<span class="bchip">${tx(p)}</span>`).join("");
  $("#sources").innerHTML=(SCOPE==="agri"?SRC:SCOPE==="env"?SRC_ENV:SRC.concat(SRC_ENV)).map(([c,l])=>`<div class="card srcg"><h4>${tx(c)}</h4><ul>${l.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener" lang="en">${esc(x[0])}</a></li>`).join("")}</ul></div>`).join("");
}

/* ---------- v2.0 · Scope switch (Agriculture | Environment | Combined) ---------- */
const scEl=$("#scopeSw");
function urlScope(){
  try{const q=new URLSearchParams(location.search).get("scope");if(SCOPES.includes(q))return q;}catch(e){}
  const m=(location.hash||"").match(/[#&]scope=(agri|env|all)\b/);return m?m[1]:null;
}
function storedScope(){try{const v=localStorage.getItem("maeScope");return SCOPES.includes(v)?v:null;}catch(e){return null;}}
function syncScopeUrl(s){
  try{const u=new URL(location.href);let ch=false;
    if(u.searchParams.has("scope")){u.searchParams.set("scope",s);ch=true;}
    if(/[#&]scope=(agri|env|all)\b/.test(u.hash)){u.hash=u.hash.replace(/([#&])scope=(agri|env|all)\b/,"$1scope="+s);ch=true;}
    if(ch)history.replaceState(null,"",u.toString());}catch(e){}
}
function markScope(){
  scEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.scope===SCOPE));
  document.documentElement.setAttribute("data-scope",SCOPE);
  $("#scopeNote").textContent=t("sc.note."+SCOPE);
}
function setScope(s,user){
  SCOPE=SCOPES.includes(s)?s:"all";
  if(user){try{localStorage.setItem("maeScope",SCOPE);}catch(e){} syncScopeUrl(SCOPE);}
  renderAll();
}
scEl.addEventListener("click",e=>{const b=e.target.closest("button[data-scope]");if(!b||b.dataset.scope===SCOPE)return;setScope(b.dataset.scope,true);});
window.__maeScope=()=>SCOPE;

/* ---------- Language switch ---------- */
const sw=$("#langSw");
function urlLang(){
  try{const q=new URLSearchParams(location.search).get("lang");if(q==="th"||q==="en")return q;}catch(e){}
  const m=(location.hash||"").match(/[#&]lang=(en|th)\b/);return m?m[1]:null;
}
function storedLang(){try{const v=localStorage.getItem("maeLang");return v==="th"||v==="en"?v:null;}catch(e){return null;}}
function syncUrl(l){
  try{const u=new URL(location.href);let ch=false;
    if(u.searchParams.has("lang")){u.searchParams.set("lang",l);ch=true;}
    if(/[#&]lang=(en|th)\b/.test(u.hash)){u.hash=u.hash.replace(/([#&])lang=(en|th)\b/,"$1lang="+l);ch=true;}
    if(ch)history.replaceState(null,"",u.toString());}catch(e){}
}
function renderAll(){
  applyStatic();markScope();renderTabs();renderOverview();renderFeeMap();renderBench();renderPrioStatic();renderPrio();
  renderARRStatic();if($("#v-arr").classList.contains("on"))renderARR();
  renderFlows();renderWF();renderWireflow();renderRisks();
  if(drId&&dr.classList.contains("on"))drawerContent(drId);
}
function setLang(l,user){
  LANG=(l==="th")?"th":"en";
  document.documentElement.lang=LANG;
  sw.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  if(user){try{localStorage.setItem("maeLang",LANG);}catch(e){} syncUrl(LANG);}
  renderAll();
}
sw.addEventListener("click",e=>{const b=e.target.closest("button[data-lang]");if(!b||b.dataset.lang===LANG)return;setLang(b.dataset.lang,true);});
window.__maeLang=()=>LANG;

SCOPE=urlScope()||storedScope()||"all";
setLang(urlLang()||storedLang()||"en",false);
route();
})();
